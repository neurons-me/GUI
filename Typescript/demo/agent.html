<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="referrer" content="no-referrer" />
    <meta name="color-scheme" content="light dark" />
    <title>.me</title>
    <!-- Icons: GUI's self-hosted Material Symbols (demo/public), same origin, no CDN. -->
    <link rel="stylesheet" href="/material-symbols.css" />
    <style>
      /* Rules for this page's own screens skip the keys tree, which brings its own .GUI components.
         .GUI tokens: --mui-palette-* are set by GUI's <Theme> (agentTheme.tsx); the fallbacks only cover the first paint. */
      :root {
        --a-bg: var(--mui-palette-background-default, #f7f7f8);
        --a-paper: var(--mui-palette-background-paper, #ffffff);
        --a-fg: var(--mui-palette-text-primary, #16181b);
        --a-muted: var(--mui-palette-text-secondary, #5f6670);
        --a-line: var(--mui-palette-divider, rgba(0, 0, 0, 0.12));
        --a-primary: var(--mui-palette-primary-main, #16181b);
        --a-on-primary: var(--mui-palette-primary-contrastText, #ffffff);
        --a-warn: var(--mui-palette-warning-main, #c98a00);
        --a-error: var(--mui-palette-error-main, #c62828);
        --a-font: var(--gui-font, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif);
        --a-mono: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-mode]) {
          --a-bg: #0e1013; --a-paper: #15181c; --a-fg: #eceef0; --a-muted: #9aa3ad;
          --a-line: rgba(255, 255, 255, 0.12); --a-primary: #eceef0; --a-on-primary: #0e1013;
        }
      }
      *, *::before, *::after { box-sizing: border-box; }
      html, body { margin: 0; background: var(--a-bg); color: var(--a-fg); }
      /* The page's "i" (top-right) and its compact panel: straight corners and the page background, like the tree. */
      .info { position: fixed; top: 3.5rem; left: 5.5rem; right: auto; z-index: 20; }
      .info > button.info-btn { display: inline-flex; align-items: center; justify-content: center; width: 30px; height: 30px; padding: 0;
        color: var(--a-muted); background: transparent; border: 1px solid transparent; border-radius: 4px; cursor: pointer; }
      .info > button.info-btn:hover:not(:disabled), .info > button.info-btn[aria-expanded=true] { color: var(--a-fg); border-color: var(--a-line); }
      .info > button.info-btn .material-symbols-rounded { font-size: 18px; }
      .info-panel { position: absolute; top: 36px; right: 0; width: min(260px, calc(100vw - 20px)); box-sizing: border-box;
        padding: 10px 12px; background: var(--a-bg); color: var(--a-fg); border: 1px solid var(--a-line); border-radius: 0;
        box-shadow: 0 6px 18px rgba(0, 0, 0, 0.18); font-size: 0.8rem; line-height: 1.45; }
      .info-panel[hidden] { display: none; }
      .info-panel p { margin: 0; color: var(--a-fg); }
      .info-panel p + p { margin-top: 6px; color: var(--a-muted); }
      body { font: 15px/1.5 var(--a-font); -webkit-font-smoothing: antialiased; }
      main { max-width: 460px; margin: 0 auto; padding: 28px 20px 40px; }
      h1:not([data-agent=keys-tree] *) { margin: 0 0 4px; font-size: 1.3rem; font-weight: 600; letter-spacing: -0.01em; line-height: 1.3; }
      h1 + p:not([data-agent=keys-tree] *), .lead:not([data-agent=keys-tree] *) { margin: 0 0 18px; color: var(--a-muted); font-size: 0.9rem; }
      p:not([data-agent=keys-tree] *) { margin: 0 0 12px; }
      .label:not([data-agent=keys-tree] *) { margin: 14px 0 2px; font-size: 0.72rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; color: var(--a-muted); }
      .origin:not([data-agent=keys-tree] *) { margin: 0 0 16px; font: 600 1rem/1.4 var(--a-mono); word-break: break-all; }
      dl:not([data-agent=keys-tree] *) { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; margin: 0 0 18px; padding: 12px 14px;
           background: var(--a-paper); border: 1px solid var(--a-line); border-radius: 4px; }
      dt:not([data-agent=keys-tree] *) { color: var(--a-muted); font-size: 0.85rem; }
      dd:not([data-agent=keys-tree] *) { margin: 0; word-break: break-all; font: 0.82rem/1.45 var(--a-mono); }
      ul:not([data-agent=keys-tree] *) { margin: 2px 0 16px; padding-left: 18px; }
      .field:not([data-agent=keys-tree] *) { position: relative; margin: 0 0 12px; }
      .field > .material-symbols-rounded:not([data-agent=keys-tree] *) { position: absolute; top: 50%; transform: translateY(-50%); font-size: 20px; color: var(--a-muted); pointer-events: none; }
      .field > .lead-icon:not([data-agent=keys-tree] *) { left: 10px; }
      .field > .chevron:not([data-agent=keys-tree] *) { right: 8px; }
      select:not([data-agent=keys-tree] *), input:not([data-agent=keys-tree] *) {
        display: block; width: 100%; margin: 0 0 10px; padding: 9px 12px; font: inherit; color: var(--a-fg);
        background: var(--a-paper); border: 1px solid var(--a-line); border-radius: 4px; outline: none;
      }
      .field select:not([data-agent=keys-tree] *) { appearance: none; -webkit-appearance: none; margin: 0; padding: 9px 36px; cursor: pointer; font-family: var(--a-mono); font-size: 0.85rem; }
      select:not([data-agent=keys-tree] *):focus-visible, input:not([data-agent=keys-tree] *):focus-visible, button:not([data-agent=keys-tree] *):focus-visible { outline: 2px solid var(--a-primary); outline-offset: 1px; }
      .actions:not([data-agent=keys-tree] *) { display: flex; gap: 8px; justify-content: flex-end; margin-top: 4px; }
      button:not([data-agent=keys-tree] *) {
        display: inline-flex; align-items: center; gap: 6px; padding: 8px 16px; font: 500 0.9rem/1.2 var(--a-font);
        color: var(--a-fg); background: transparent; border: 1px solid var(--a-line); border-radius: 4px; cursor: pointer;
      }
      button:not([data-agent=keys-tree] *):hover:not(:disabled) { border-color: var(--a-fg); }
      button[type=submit]:not([data-agent=keys-tree] *), button[data-agent=create]:not([data-agent=keys-tree] *), button[data-agent=finish]:not([data-agent=keys-tree] *) { background: var(--a-primary); color: var(--a-on-primary); border-color: var(--a-primary); }
      button:not([data-agent=keys-tree] *):disabled { opacity: 0.45; cursor: default; }
      [data-agent=status]:not([data-agent=keys-tree] *), [data-agent=keys-status]:not([data-agent=keys-tree] *), [data-agent=waiting]:not([data-agent=keys-tree] *), [data-agent=create-loading]:not([data-agent=keys-tree] *) { color: var(--a-muted); font-size: 0.85rem; margin-top: 10px; }
      [data-agent=keys-status]:not([data-agent=keys-tree] *):empty, [data-agent=status]:not([data-agent=keys-tree] *):empty { display: none; }
      [data-agent=keys-status]:not([data-agent=keys-tree] *):not(:empty) { display: flex; flex-direction: column; align-items: flex-start; gap: 8px; max-width: 28rem; }
      [data-agent=keys-empty]:not([data-agent=keys-tree] *) { font-weight: 600; color: var(--a-fg); }
      [data-agent=local-test-note]:not([data-agent=keys-tree] *) { color: var(--a-muted); font-size: 0.85rem; }
      .changed:not([data-agent=keys-tree] *), [data-agent=invalidated]:not([data-agent=keys-tree] *) { padding: 8px 12px; border-radius: 4px; border: 1px solid var(--a-warn);
        background: color-mix(in srgb, var(--a-warn) 12%, transparent); }
      [data-agent=refused]:not([data-agent=keys-tree] *), [data-agent=create-invalid]:not([data-agent=keys-tree] *), [data-agent=framed]:not([data-agent=keys-tree] *), [data-agent=facebook-error]:not([data-agent=keys-tree] *) { color: var(--a-error); }
      details:not([data-agent=keys-tree] *) { margin: 0 0 18px; font-size: 0.75rem; color: var(--a-muted); }
      details p:not([data-agent=keys-tree] *) { font-family: var(--a-mono); word-break: break-all; margin: 4px 0; }
      [data-agent=keys-tree] { margin: 4px -4px 0; }
      /* Keys home: the QR lives in a corner and opens the card; do not keep the old centred column. */
      main:has([data-agent=keys-home]) { max-width: none; margin: 0; padding: 0; min-height: 100vh; }
      main:has([data-agent=keys-home]) [data-agent=keys-tree] { margin: 0; }
      main:has([data-agent=keys-home]) [data-agent=keys-home] > .field {
        position: fixed; top: 0.6rem; left: 5.5rem; transform: none; z-index: 21;
        width: min(16rem, calc(100vw - 12rem)); margin: 0;
      }
      /* Transient notice (snackbar): bottom centre, fades in, then out (agent.main.ts showNotice). */
      .notice { position: fixed; left: 50%; bottom: 20px; z-index: 10; display: flex; align-items: center; gap: 8px;
        max-width: calc(100vw - 32px); padding: 10px 14px; transform: translateX(-50%);
        font: 500 0.85rem/1.35 var(--a-font); color: var(--a-fg); background: var(--a-paper);
        border: 1px solid var(--a-line); border-radius: 4px; box-shadow: 0 6px 24px rgba(0, 0, 0, 0.18);
        animation: notice-in 180ms ease-out; transition: opacity 350ms ease, translate 350ms ease; }
      .notice > .material-symbols-rounded { font-size: 20px; color: var(--mui-palette-success-main, #2e7d32); }
      .notice.leaving { opacity: 0; translate: 0 8px; }
      @keyframes notice-in { from { opacity: 0; translate: 0 8px; } to { opacity: 1; translate: 0 0; } }
      @media (prefers-reduced-motion: reduce) { .notice { animation: none; transition: none; } }
    </style>
  </head>
  <body>
    <main id="agent"></main>
    <script type="module" src="/agent.main.ts"></script>
  </body>
</html>
