<script>
  (() => {
    const TARGET_LABEL = 'Getting Started';

    function resetSidebarPersistence() {
      try {
        const keys = Object.keys(window.localStorage || {});
        for (const key of keys) {
          const isStorybookKey = /^storybook/i.test(String(key || ''));
          const isSidebarState = /(sidebar|expanded|navigation|explorer)/i.test(String(key || ''));
          if (isStorybookKey && isSidebarState) {
            window.localStorage.removeItem(key);
          }
        }
      } catch {
        // ignore storage issues
      }
    }

    function syncSidebarExpansion() {
      const buttons = Array.from(document.querySelectorAll('[data-side="left"] button[aria-expanded]'));
      if (!buttons.length) return;

      for (const button of buttons) {
        const label = (button.textContent || '').trim();
        if (!label || label.includes('/')) continue;
        const expanded = button.getAttribute('aria-expanded') === 'true';
        const shouldExpand = label.includes(TARGET_LABEL);

        if (shouldExpand && !expanded) {
          button.click();
        } else if (!shouldExpand && expanded) {
          button.click();
        }
      }
    }

    const observer = new MutationObserver(() => {
      window.requestAnimationFrame(syncSidebarExpansion);
    });

    window.addEventListener('load', () => {
      resetSidebarPersistence();
      syncSidebarExpansion();
      observer.observe(document.body, {
        subtree: true,
        childList: true,
        attributes: true,
        attributeFilter: ['aria-expanded'],
      });
    });
  })();
</script>
